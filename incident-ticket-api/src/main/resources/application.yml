spring:
  application:
    name: incident-ticket-api

  datasource:
    url: jdbc:postgresql://localhost:5432/incident_ticket_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect


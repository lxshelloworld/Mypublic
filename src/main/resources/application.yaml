spring:
  application:
    name: incident-ticket-api

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  # Hibernate 配置（自动更新数据库结构）
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true  # 可选：显示 SQL 查询日志

  # H2 控制台配置（可选，允许通过浏览器访问）
  h2:
    console:
      enabled: true
      path: /h2-console